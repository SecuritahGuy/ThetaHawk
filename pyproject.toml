[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thetahawk"
version = "0.1.0"
description = "Self-hosted options intelligence and research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "numpy>=2.0",
  "polars>=1.15",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "scipy>=1.14",
  "streamlit>=1.40",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["ruff>=0.7"]
yahoo = ["yfinance>=0.2.66"]

[project.scripts]
thetahawk-demo = "thetahawk.demo:run_demo_scan"
thetahawk-api = "thetahawk.api:run"
thetahawk-dashboard = "thetahawk.dashboard:main"
thetahawk-ingest = "thetahawk.ingest:main"
thetahawk-scan = "thetahawk.scan:main"
thetahawk-equity-scan = "thetahawk.equity_scan:main"
thetahawk-earnings-calendar = "thetahawk.earnings_calendar:main"
thetahawk-volatility-scan = "thetahawk.volatility_scan:main"
thetahawk-scheduled-collection = "thetahawk.scheduled_collection:main"
thetahawk-replay-audit = "thetahawk.replay:main"
thetahawk-option-snapshots = "thetahawk.option_snapshots:main"
thetahawk-earnings-option-snapshots = "thetahawk.earnings_option_snapshots:main"
thetahawk-sec-filings-scan = "thetahawk.sec_filings:main"
thetahawk-unusual-scan = "thetahawk.unusual_scan:main"
thetahawk-discover = "thetahawk.discover:main"
thetahawk-data-status = "thetahawk.data_status:main"
thetahawk-earnings-validation = "thetahawk.earnings_validation:main"
thetahawk-equity-backtest = "thetahawk.equity_backtest:main"
thetahawk-equity-sample = "thetahawk.equity_sample:main"

[tool.setuptools.packages.find]
include = ["thetahawk*"]

[tool.ruff]
line-length = 100
target-version = "py311"
